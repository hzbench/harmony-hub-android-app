name: Build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK; this also accepts its licenses and
      # caches Gradle's downloads between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: VERSION is a release version
        run: |
          v=$(tr -d ' \t\r\n' < VERSION)
          [[ "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]] || { echo "::error::VERSION must look like 1.2.3 with minor and patch of 99 or less (it is '$v')"; exit 1; }

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Keep the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: hub-remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
