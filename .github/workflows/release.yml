name: Release

# A release is made from main, by changing the VERSION file in a pull request. When a push to main
# changes VERSION and the Build workflow has passed on that commit, this builds the signed APK, tags
# the commit v<VERSION> and publishes it as a GitHub Release. A VERSION that already has a tag does
# nothing, so merging without a bump never releases.
# Run by hand from main (Actions > Release > Run workflow): with "publish" off it builds a signed APK
# as a downloadable artifact only; with it on it publishes VERSION the same way a push does (for
# example to retry after a failure that needed a fix elsewhere).
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish VERSION as a release (otherwise only build a download)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # to look up whether the Build workflow passed
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      code: ${{ steps.plan.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all tags, to check VERSION against earlier releases

      - name: Work out what to release
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          skip=false; publish=false; version="0.0.0-dev-${GITHUB_SHA::7}"; code=1
          # Written once, whichever way this exits.
          trap '{ echo "skip=$skip"; echo "publish=$publish"; echo "version=$version"; echo "code=$code"; } >> "$GITHUB_OUTPUT"' EXIT
          # A hand-run build is signed with the real key, so only main may be built this way.
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Run this workflow from main."; exit 1; }
          [[ "$PUBLISH" == "true" ]] || exit 0
          version=$(tr -d ' \t\r\n' < VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]] || { echo "::error::VERSION must look like 1.2.3 without leading zeros, minor and patch 0-99 (it is '$version')"; exit 1; }
          code=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
          # Released means a published GitHub Release exists; a tag left by a failed run does not count.
          if [[ "$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null)" == "false" ]]; then
            echo "::notice::v$version is already released; nothing to do. Change VERSION to release again."
            skip=true; exit 0
          fi
          git fetch --quiet --tags origin
          newest=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1 || true)
          if [[ -n "$newest" && "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -1)" != "$version" ]]; then
            echo "::error::VERSION $version is lower than the newest release $newest; versions only go up."; exit 1
          fi
          # Only tested code is signed with the real key. Build runs on the same push, so it may not
          # be listed yet, or may still be going: wait for it (a few minutes to appear, 15 to finish).
          for attempt in $(seq 1 30); do
            passed=$(gh run list --workflow Build --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
            [[ "$passed" -gt 0 ]] && break
            listed=$(gh run list --workflow Build --commit "$GITHUB_SHA" --json databaseId --jq length)
            running=$(gh run list --workflow Build --commit "$GITHUB_SHA" --json status --jq '[.[] | select(.status != "completed")] | length')
            if [[ "$listed" -gt 0 && "$running" -eq 0 ]]; then
              echo "::error::The Build workflow ran on this commit and did not pass."; exit 1
            fi
            [[ "$listed" -gt 0 || "$attempt" -le 6 ]] || { echo "::error::No Build run was found for this commit."; exit 1; }
            echo "Waiting for the Build workflow on this commit..."
            sleep 30
          done
          [[ "$passed" -gt 0 ]] || { echo "::error::The Build workflow did not finish in time."; exit 1; }
          publish=true
          echo "Releasing $version"

  release:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # The signing key is only handed to the steps below, after the tests and third-party actions
      # have run; the repository's own build then reads it from a file that is deleted afterwards.
      - name: Restore the signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HUBREMOTE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HUBREMOTE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HUBREMOTE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HUBREMOTE_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!v}" ]] || { echo "::error::The secret for $v is not set (see the README, Release APK)"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hub-remote-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/hub-remote-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "HUBREMOTE_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Build the signed APK
        run: ./gradlew assembleRelease --no-daemon -PversionName=${{ needs.plan.outputs.version }} -PversionCode=${{ needs.plan.outputs.code }}

      - name: Remove the signing key from the runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/hub-remote-release.jks" "$RUNNER_TEMP/signing.properties"

      - name: Check the APK
        id: apk
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.HUBREMOTE_CERT_SHA256 }}
          WANT_VERSION_NAME: ${{ needs.plan.outputs.version }}
          WANT_VERSION_CODE: ${{ needs.plan.outputs.code }}
        run: |
          [[ -n "$EXPECTED_CERT_SHA256" ]] || { echo "::error::The variable HUBREMOTE_CERT_SHA256 is not set (see the README, Release APK)"; exit 1; }
          # The newest build-tools that actually has both tools (a preview directory may not).
          tools=""
          for d in $(ls -d "$ANDROID_HOME"/build-tools/* | sort -V -r); do
            [[ -x "$d/apksigner" && -x "$d/aapt" ]] && { tools="$d"; break; }
          done
          [[ -n "$tools" ]] || { echo "::error::No build-tools directory with apksigner and aapt"; exit 1; }
          src=app/build/outputs/apk/release/app-release.apk

          "$tools/apksigner" verify --verbose --print-certs "$src" > "$RUNNER_TEMP/certs.txt" 2>&1 \
            || { cat "$RUNNER_TEMP/certs.txt"; echo "::error::The APK's signature does not verify"; exit 1; }
          # Older apksigner prints "Signer #1 certificate ...", newer "V2 Signer: certificate ...".
          norm() { printf '%s' "$1" | tr -d ': \t\r\n' | tr 'A-F' 'a-f'; }   # hex with or without colons
          cert=$(awk '/certificate SHA-256 digest/ && !/public key/ {print $NF; exit}' "$RUNNER_TEMP/certs.txt")
          [[ -n "$cert" && "$(norm "$cert")" == "$(norm "$EXPECTED_CERT_SHA256")" ]] \
            || { cat "$RUNNER_TEMP/certs.txt"; echo "::error::Not signed with the expected key (got '$cert')"; exit 1; }

          badging=$("$tools/aapt" dump badging "$src")
          pkg=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")
          code=$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<<"$badging")
          vname=$(sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" <<<"$badging")
          [[ "$pkg" == "io.github.hzbench.hubremote" ]] || { echo "::error::The APK's package is '$pkg'"; exit 1; }
          [[ "$code" == "$WANT_VERSION_CODE" ]] || { echo "::error::The APK's version code is '$code', not $WANT_VERSION_CODE"; exit 1; }
          [[ "$vname" == "$WANT_VERSION_NAME" ]] || { echo "::error::The APK's version name is '$vname', not $WANT_VERSION_NAME"; exit 1; }

          out="hub-remote-$WANT_VERSION_NAME.apk"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ needs.plan.outputs.version }}"
          # A failed earlier attempt can leave an unpublished draft behind; replace it.
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" == "true" ]]; then gh release delete "$tag" --yes; fi
          gh release create "$tag" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "Hub Remote ${{ needs.plan.outputs.version }}" --generate-notes --target "$GITHUB_SHA"

      - name: Keep the APK as a download (hand-run builds)
        if: needs.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          retention-days: 7
