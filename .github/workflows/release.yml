name: Release

# Push a tag like v0.1.0 to build the signed APK and publish it as a GitHub Release.
# Run by hand (Actions > Release > Run workflow) to build a signed APK as a downloadable
# artifact only, without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Repository secrets (Settings > Secrets and variables > Actions). The key never touches the repo.
      KEYSTORE_BASE64: ${{ secrets.HUBREMOTE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.HUBREMOTE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.HUBREMOTE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.HUBREMOTE_KEY_PASSWORD }}
      # Repository variable: the SHA-256 of the signing certificate. The build fails if the key
      # it was given is a different one, so a wrong secret can't produce an APK that won't update.
      EXPECTED_CERT_SHA256: ${{ vars.HUBREMOTE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::The tag must look like v1.2.3"; exit 1; }
            major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
            (( minor <= 99 && patch <= 99 )) || { echo "::error::Minor and patch must be 99 or less"; exit 1; }
            name="$major.$minor.$patch"
            code=$(( major * 10000 + minor * 100 + patch ))
          else
            # A hand-run build: version code 1, so it can only be installed fresh, never over a real release.
            name="0.0.0-dev-${GITHUB_SHA::7}"
            code=1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $name (version code $code)"

      - name: Check the signing secrets are there
        shell: bash
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set (see the README, Release APK)"; exit 1; }
          done

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Restore the signing key
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hub-remote-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/hub-remote-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "HUBREMOTE_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Build the signed APK
        run: ./gradlew assembleRelease --no-daemon -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}

      - name: Check the APK
        id: apk
        shell: bash
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          src=app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$src" > "$RUNNER_TEMP/certs.txt" 2>&1 || { cat "$RUNNER_TEMP/certs.txt"; echo "::error::The APK's signature does not verify"; exit 1; }
          # Older apksigner prints "Signer #1 certificate ...", newer "V2 Signer: certificate ...".
          cert=$(awk '/certificate SHA-256 digest/ && !/public key/ {print $NF; exit}' "$RUNNER_TEMP/certs.txt")
          [[ -n "$cert" && "${cert,,}" == "${EXPECTED_CERT_SHA256,,}" ]] || { cat "$RUNNER_TEMP/certs.txt"; echo "::error::Not signed with the expected key (got '$cert')"; exit 1; }
          badging=$("$tools/aapt" dump badging "$src")
          grep -q "name='io.github.mpdeglau.hubremote' versionCode='${{ steps.version.outputs.code }}' versionName='${{ steps.version.outputs.name }}'" <<<"$badging" \
            || { echo "::error::The APK's package or version is not what was asked for"; exit 1; }
          out="hub-remote-${{ steps.version.outputs.name }}.apk"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Remove the signing key from the runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/hub-remote-release.jks" "$RUNNER_TEMP/signing.properties"

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "Hub Remote ${{ steps.version.outputs.name }}" --generate-notes --verify-tag

      - name: Keep the APK as a download (hand-run builds)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          retention-days: 7
